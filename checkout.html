<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Order | $500 Websites</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7fb', 100: '#d8ebf9', 200: '#b4daf5',
                            300: '#7eb6e2', 400: '#5296cb', 500: '#347ab6',
                            600: '#266198', 700: '#1d4e7d', 800: '#1a4369',
                            900: '#102a43', 950: '#0a1a2b',
                        },
                        action: {
                            50: '#fff4ed', 100: '#ffe6d4', 500: '#f26b21',
                            600: '#e65c15', 700: '#cc4b0b', 800: '#a33b09',
                        }
                    },
                    boxShadow: {
                        '3d-button': '0 8px 0 0 #cc4b0b',
                        '3d-button-hover': '0 2px 0 0 #cc4b0b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <nav class="bg-white border-b-2 border-slate-200 py-4 px-6">
        <div class="max-w-2xl mx-auto flex justify-center">
            <img src="images/logo.svg" alt="$500 Websites" class="h-10 object-contain">
        </div>
    </nav>

    <!-- Progress bar -->
    <div class="h-1.5 bg-slate-200">
        <div class="h-full bg-action-500 transition-all" style="width: 100%"></div>
    </div>

    <main class="flex-1 py-12 px-6">
        <div class="max-w-xl mx-auto">

            <p class="text-xs font-black text-slate-400 uppercase tracking-widest text-center mb-8">Step 7 of 7 &mdash; Order Summary</p>

            <h1 class="text-4xl font-black text-brand-900 text-center mb-10">Here's What You're Getting</h1>

            <!-- Order summary card -->
            <div class="bg-white border-4 border-brand-900 rounded-2xl overflow-hidden shadow-[8px_8px_0_0_#102a43] mb-8">
                <div class="bg-brand-900 px-6 py-4">
                    <p class="text-brand-200 font-black text-sm uppercase tracking-widest">Your Order</p>
                </div>
                <div id="order-items" class="divide-y-2 divide-slate-100">
                    <!-- Populated by JS -->
                </div>
                <div class="px-6 py-5 bg-slate-50 border-t-4 border-brand-900 flex justify-between items-center">
                    <span class="font-black text-brand-900 text-xl">Total Due Today</span>
                    <span id="order-total" class="font-black text-action-600 text-3xl"></span>
                </div>
            </div>

            <!-- Customer info recap -->
            <div id="customer-info" class="bg-brand-50 border-2 border-brand-200 rounded-xl p-4 mb-8 text-sm font-medium text-brand-700">
                <!-- Populated by JS -->
            </div>

            <!-- CTA -->
            <button id="pay-btn" type="button" class="block w-full bg-action-500 hover:bg-action-600 text-white py-6 rounded-2xl font-black text-2xl uppercase tracking-wide transition-all shadow-3d-button hover:shadow-3d-button-hover hover:translate-y-[6px] active:translate-y-[6px] active:shadow-3d-button-hover border-2 border-action-700 mb-4 disabled:opacity-50 disabled:cursor-wait">
                Complete My Order
            </button>

            <div id="error-msg" class="hidden text-red-600 font-bold text-sm text-center mb-4"></div>

            <div class="flex items-center justify-center gap-2 text-xs text-slate-400 font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                256-bit SSL &mdash; Powered by Stripe
            </div>

        </div>
    </main>

    <script>
        const order = JSON.parse(localStorage.getItem('order') || '{}');

        const ITEMS = [
            { key: 'base',          label: '10-Page SEO Website',                         price: 500,  always: true },
            { key: 'priorityBuild', label: 'Priority Build',                              price: 25,   always: false },
            { key: 'upsell1',       label: 'City Expansion Pages',                        price: 389,  always: false },
            { key: 'upsell2',       label: 'Authority Boost',                             price: 99,   always: false },
            { key: 'upsell3',       label: 'WordPress Elementor Kit Theme + Plugins',     price: 225,  always: false },
            { key: 'upsell4',       label: 'Lead Follow-Up System',                       price: 885,  always: false },
        ];

        let SELECTED = [];
        let TOTAL_LABEL = '';

        function esc(str) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(str != null ? String(str) : ''));
            return d.innerHTML;
        }

        function init() {
            SELECTED = ITEMS.filter(i => i.always || order[i.key]);
            const total = SELECTED.reduce((sum, i) => sum + i.price, 0);
            TOTAL_LABEL = '$' + total.toLocaleString();

            const itemsEl = document.getElementById('order-items');
            SELECTED.forEach(item => {
                const row = document.createElement('div');
                row.className = 'px-6 py-4 flex justify-between items-center';
                row.innerHTML = `
                    <span class="flex items-center gap-2 font-medium text-slate-700">
                        <span class="text-green-500 font-black">✓</span>
                        ${item.label}
                    </span>
                    <span class="font-black text-brand-900">$${item.price.toLocaleString()}</span>
                `;
                itemsEl.appendChild(row);
            });

            document.getElementById('order-total').textContent = TOTAL_LABEL;

            document.getElementById('customer-info').innerHTML = `
                <p class="font-black text-brand-800 mb-1">Ordering for:</p>
                <p>${esc(order.name)} &mdash; ${esc(order.email)} &mdash; ${esc(order.phone)}</p>
                <p class="capitalize mt-0.5">${esc((order.trade || '').replace(/-/g, ' '))}</p>
            `;

            const btn = document.getElementById('pay-btn');
            btn.textContent = 'Complete My Order — ' + TOTAL_LABEL;
            btn.addEventListener('click', startCheckout);
        }

        async function startCheckout() {
            const btn = document.getElementById('pay-btn');
            const errEl = document.getElementById('error-msg');
            if (btn.disabled) return;
            btn.disabled = true;
            btn.textContent = 'Redirecting to secure payment...';
            errEl.classList.add('hidden');

            const selectedKeys = SELECTED.map(i => i.key);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const res = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerEmail: order.email,
                        metadata: { name: order.name, phone: order.phone, trade: order.trade },
                        items: selectedKeys,
                    }),
                    signal: controller.signal,
                });
                clearTimeout(timeoutId);

                if (!res.ok) {
                    let message = 'Could not create checkout session. Please try again.';
                    try { const body = await res.json(); if (body.error) message = body.error; } catch {}
                    throw new Error(message);
                }

                const session = await res.json();
                if (!session.url) throw new Error('Checkout URL was not returned. Please try again.');
                window.location.href = session.url;
            } catch (err) {
                clearTimeout(timeoutId);
                const message = err.name === 'AbortError'
                    ? 'Request timed out. Please check your connection and try again.'
                    : err.message || 'Something went wrong. Please try again.';
                errEl.textContent = message;
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Complete My Order — ' + TOTAL_LABEL;
            }
        }

        if (!order.email) {
            window.location.href = '/';
        } else {
            init();
        }
    </script>

</body>
</html>
