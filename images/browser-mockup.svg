<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Browser Chrome -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#ffffff" stroke="#0b2a4a" stroke-width="4"/>
  <!-- Title Bar -->
  <rect x="20" y="20" width="760" height="50" rx="16" fill="#0b2a4a"/>
  <rect x="20" y="50" width="760" height="20" fill="#0b2a4a"/>
  <!-- Window Dots -->
  <circle cx="52" cy="45" r="8" fill="#ff5f57"/>
  <circle cx="78" cy="45" r="8" fill="#febc2e"/>
  <circle cx="104" cy="45" r="8" fill="#28c840"/>
  <!-- URL Bar -->
  <rect x="150" y="33" width="500" height="24" rx="12" fill="#1a3d5c" opacity="0.5"/>
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8bb8d9">yourcompany.com</text>

  <!-- Hero Section -->
  <rect x="40" y="85" width="720" height="140" rx="8" fill="#f0f7ff"/>
  <!-- Nav bar -->
  <rect x="55" y="95" width="100" height="14" rx="4" fill="#0b2a4a"/>
  <rect x="610" y="95" width="60" height="14" rx="4" fill="#0b2a4a" opacity="0.3"/>
  <rect x="680" y="95" width="60" height="14" rx="4" fill="#f26b21"/>
  <!-- Hero Text -->
  <rect x="55" y="130" width="300" height="20" rx="4" fill="#0b2a4a"/>
  <rect x="55" y="158" width="240" height="14" rx="4" fill="#0b2a4a" opacity="0.3"/>
  <rect x="55" y="180" width="120" height="30" rx="6" fill="#f26b21"/>
  <!-- Hero Image Placeholder -->
  <rect x="480" y="120" width="260" height="90" rx="8" fill="#d8ebf9"/>
  <text x="610" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#0b2a4a" opacity="0.3">📸</text>

  <!-- Services Section -->
  <rect x="40" y="240" width="720" height="100" rx="8" fill="#ffffff"/>
  <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#0b2a4a">Our Services</text>
  <!-- Service Cards -->
  <rect x="55" y="285" width="155" height="45" rx="6" fill="#f0f7ff" stroke="#d8ebf9" stroke-width="2"/>
  <text x="132" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0b2a4a">🔧 Plumbing</text>
  <rect x="225" y="285" width="155" height="45" rx="6" fill="#f0f7ff" stroke="#d8ebf9" stroke-width="2"/>
  <text x="302" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0b2a4a">⚡ Electrical</text>
  <rect x="395" y="285" width="155" height="45" rx="6" fill="#f0f7ff" stroke="#d8ebf9" stroke-width="2"/>
  <text x="472" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0b2a4a">❄️ HVAC</text>
  <rect x="565" y="285" width="155" height="45" rx="6" fill="#f0f7ff" stroke="#d8ebf9" stroke-width="2"/>
  <text x="642" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0b2a4a">🏗️ Roofing</text>

  <!-- Reviews / Map Section -->
  <rect x="40" y="355" width="350" height="110" rx="8" fill="#f0f7ff"/>
  <text x="215" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0b2a4a">⭐⭐⭐⭐⭐ Google Reviews</text>
  <rect x="60" y="395" width="310" height="10" rx="3" fill="#d8ebf9"/>
  <rect x="60" y="415" width="260" height="10" rx="3" fill="#d8ebf9"/>
  <rect x="60" y="435" width="290" height="10" rx="3" fill="#d8ebf9"/>

  <rect x="410" y="355" width="350" height="110" rx="8" fill="#e8f5e9"/>
  <text x="585" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#1b5e20">📍 GMB Map Embed</text>
  <rect x="430" y="395" width="310" height="55" rx="6" fill="#c8e6c9"/>
  <circle cx="500" cy="422" r="8" fill="#f26b21"/>
</svg>
